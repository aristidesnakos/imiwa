name: Sync Story Videos

# Links each episode's YouTube video from the channel's public feed, so the
# owner uploads a video and nothing else. Daily at 14:17 UTC: an hour after the
# Saturday release (config.newsletter.sendTimeUtc, 13:00), so a Short is linked
# the day it goes public.
#
# The hour is load-bearing. YouTube's feed endpoint goes down for hours every
# day: measured from a GitHub runner every 5 minutes, 2026-10-06 16:23 to
# 2026-10-07 08:50 UTC, every request answered 200 except 00:35-07:00 UTC, when
# 95% were a 404 (or 500) HTML page with no cache headers. The channel feed, the
# uploads-playlist feed (UU...) and the Shorts-playlist feed (UUSH...) failed
# together, cache-busted or not, so no other feed URL is a fallback and no retry
# inside the window helps. The old 05:17 slot failed on five of the seven days
# from 2026-10-01 (issue #46); one success ran six hours late, the other caught
# one of the window's sporadic 200s. It is not the runner's IP: five runners on
# five Azure IPs all read the feed at 16:20 UTC. Public reports since December 2025 describe
# the same daily outage, at an hour that has moved before. If this job starts
# failing with "HTTP 404", the window has moved: probe it again and move the cron.
# `pnpm validate:video-sync` refuses a cron within an hour of the measured window
# or not after the Saturday release.
#
# A failed day loses nothing: the feed lists the latest 15 uploads and the sync
# reads all of it, so the next good run links whatever was missed.
#
# `pnpm stories:sync-videos` matches a title to an episode by the kanji listed
# before the "|" (at least three, all inside exactly one episode's focusKanji),
# only ADDS entries to data/stories/videos.ts, and never overwrites a hand fix.
# Rules and fixtures: scripts/stories/video-sync-core.ts, `pnpm validate:video-sync`.
#
# The commit deliberately has NO skip-CI marker: it changes what the episode
# page renders, so Vercel must deploy it.
#
# Caveat: a push made with GITHUB_TOKEN does not trigger other workflows, so the
# Lighthouse and schema checks do not run on a bot commit. The first mapping
# (episodes 1 to 4) was therefore shipped by a human push so CI exercised the
# section once; `pnpm validate:stories` below is the gate on every bot commit.
#
# Needs no secret: the feed is public.

on:
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:

concurrency:
  group: sync-story-videos
  cancel-in-progress: false

jobs:
  sync:
    name: Link new episode videos
    runs-on: ubuntu-latest
    defaults:
      run:
        # Explicit bash turns on pipefail, so `script | tee log` still fails the
        # step when the script does (the default shell does not).
        shell: bash
    permissions:
      # Commit data/stories/videos.ts; open the failure issue.
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the matching rules
        run: pnpm validate:video-sync

      - name: Sync videos from the channel feed
        run: pnpm stories:sync-videos 2>&1 | tee "$RUNNER_TEMP/sync-videos.log"

      - name: Validate the episode data
        run: pnpm validate:stories 2>&1 | tee -a "$RUNNER_TEMP/sync-videos.log"

      - name: Commit and push new links
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain data/stories/videos.ts)" ]; then
            echo "No change to data/stories/videos.ts, nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stories/videos.ts
          git commit -m "feat(stories): link new episode video(s) from the YouTube channel"
          # Rebase before pushing in case a human pushed while the job ran.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Same pattern as weekly-broadcast.yml: one open issue per failure title,
      # commented on rather than stacked. An unmatched title is NOT a failure;
      # it only shows in the log.
      - name: Report that the video sync failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Explicit rather than inferred from the git remote: this step must
          # survive a failure in Checkout, when there is no local repo.
          GH_REPO: ${{ github.repository }}
          ISSUE_LABEL: video-sync
          ISSUE_TITLE: '[Videos] Episode video sync failed'
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # `gh issue create --label X` hard-fails on a label that does not
          # exist, which would swallow the alert. Create on demand.
          gh label create "$ISSUE_LABEL" \
            --color FBCA04 \
            --description "Automated YouTube video linking" \
            >/dev/null 2>&1 || true

          BODY_FILE="$RUNNER_TEMP/sync-videos-issue.md"
          LOG_FILE="$RUNNER_TEMP/sync-videos.log"
          {
            printf '%s\n' "The daily video sync failed, so new episode videos are not being linked. Nothing already live is affected."
            printf '\n**Failed run:** %s\n' "$RUN_URL"
            if [ -s "$LOG_FILE" ]; then
              printf '\nThe end of its output:\n\n```\n'
              tail -n 40 "$LOG_FILE"
              printf '```\n'
            else
              printf '\nIt failed before the script printed anything: checkout, dependency install, the rules check, or runner setup. The run log says which step.\n'
            fi
            cat <<'EOF'

          ### Likely causes

          1. YouTube's feed answered 404 or 500. It is down for hours every day (00:35-07:00 UTC when measured on
             2026-10-07, see the workflow header) and this job runs outside that window. One failed day loses nothing;
             several in a row mean the window has moved over 14:17 UTC: re-measure it and move the cron.
          2. `pnpm validate:stories` failed on the new link (bad id shape, duplicate id): fix `data/stories/videos.ts` by hand.
          3. The push was rejected (branch protection, or a conflicting commit).

          A video whose title lists no episode's focus kanji is not a failure: it is printed as `unmatched` in the log
          and needs its title fixed on YouTube, or a line added to `data/stories/videos.ts` by hand.

          Close this issue once a run succeeds (Actions, Sync Story Videos, Run workflow).

          _Opened automatically by `.github/workflows/sync-story-videos.yml`._
          EOF
          } > "$BODY_FILE"

          EXISTING=$(gh issue list \
            --state open \
            --label "$ISSUE_LABEL" \
            --limit 100 \
            --json number,title \
            --jq 'map(select(.title == $ENV.ISSUE_TITLE)) | .[0].number // empty') || EXISTING=

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY_FILE"
            echo "Commented on existing issue #${EXISTING}."
          else
            gh issue create \
              --title "$ISSUE_TITLE" \
              --label "$ISSUE_LABEL" \
              --body-file "$BODY_FILE"
          fi
