name: Weekly Broadcast

# Schedules the next episode of The Travels of Tan in Resend, for Saturday at
# 13:00 UTC.
#
# Six episodes went up and not one was broadcast. The weekly send was a manual
# ritual (make a draft, schedule it in the dashboard) and nobody ran it. On
# 2026-09-27 the owner decided the scheduling should run itself, reversing the
# "no cron" decision recorded in docs/prd/story-delivery-resend.md §5 Phase 4.
# This runs scripts/stories/schedule-weekly-broadcast.ts; which episode and
# which instant are decided by lib/email/broadcast-queue.ts and
# lib/email/send-schedule.ts, and `pnpm validate:broadcast` asserts both.
#
# It never sends. There is no send route in the app and no contact loop: the
# script asks Resend to schedule one broadcast to the weekly-stories segment,
# and Resend does the queueing, throttling, unsubscribe filtering and the send
# itself at scheduled_at. Having scheduled one, it opens a GitHub issue, the
# review window, saying how to cancel it in Resend. With nothing to schedule it
# opens a write-by reminder instead, and does not fail.
#
# Missing Resend secrets FAIL, loudly, with an issue. That is deliberately
# unlike the end-to-end job in subscribe-live-check.yml, which skips: a
# silently skipped send is the failure this job exists to end.
#
# Runbook: docs/runbooks/newsletter.md.

on:
  schedule:
    # Wednesdays and Fridays at 12:07 UTC. Wednesday is write-by (the Saturday
    # send minus config.newsletter.writeLeadDays), so an episode imported by
    # then gets a three-day review window; Friday is the second chance, for an
    # episode imported late or a Wednesday run that failed. GitHub can delay a
    # scheduled run, most often at the top of the hour, which is why these run
    # at seven past; under heavy load it can drop one, and each day is the
    # other's backstop. The send day and time live in config.newsletter: if
    # they move, move these too.
    - cron: '7 12 * * 3'
    - cron: '7 12 * * 5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print what it would do; nothing is created, scheduled or posted'
        type: boolean
        default: false

# Never two at once: two runs reading the same queue could each build a
# broadcast for the same episode.
concurrency:
  group: weekly-broadcast
  cancel-in-progress: false

jobs:
  schedule-broadcast:
    name: Schedule the next episode for Saturday
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The review issue, the write-by reminder, and the failure report. A red
      # run in the Actions tab is not a notification; nobody reads that tab.
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Must run before setup-node so that `cache: pnpm` can find pnpm.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The decisions the job is about to act on, checked first. Most changes
      # reach main without a pull request, so the PR check alone would not stop
      # a broken rule, or an episode title the ledger cannot read back, from
      # booking a real send. Credential-free and quick.
      - name: Validate the schedule logic
        shell: bash
        run: |
          set -o pipefail
          pnpm validate:broadcast 2>&1 | tee -a "$RUNNER_TEMP/weekly-broadcast.log"

      # Fail, never skip: see the header. The `secrets` context is not
      # available in a job-level `if`, so the gate is a step.
      - name: Are the Resend secrets present?
        id: gate
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_WEEKLY_STORIES_SEGMENT_ID: ${{ secrets.RESEND_WEEKLY_STORIES_SEGMENT_ID }}
        run: |
          missing=""
          [ -n "$RESEND_API_KEY" ] || missing="RESEND_API_KEY"
          [ -n "$RESEND_WEEKLY_STORIES_SEGMENT_ID" ] || missing="${missing:+$missing and }RESEND_WEEKLY_STORIES_SEGMENT_ID"
          if [ -n "$missing" ]; then
            echo "missing=$missing" >> "$GITHUB_OUTPUT"
            echo "::error::Not configured. Missing repository secret(s): $missing. No episode can be scheduled until they are set."
            exit 1
          fi

      - name: Schedule the next episode
        env:
          # RESEND_API_KEY must be a Full access key: a Sending-access key
          # cannot list or schedule broadcasts.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_WEEKLY_STORIES_SEGMENT_ID: ${{ secrets.RESEND_WEEKLY_STORIES_SEGMENT_ID }}
          # The review issue is part of the contract: the script will not
          # schedule anything it cannot open one for.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -o pipefail
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          pnpm stories:schedule-broadcast "${args[@]}" 2>&1 | tee -a "$RUNNER_TEMP/weekly-broadcast.log"

      # One handler for every failure: missing secrets, a guard that refused,
      # a Resend state the script will not guess about, or a job that never got
      # as far as the script. The end of the output goes into the issue; the
      # script never prints an address, a key or the segment id, and scrubs
      # anything shaped like one.
      - name: Report that the weekly broadcast did not run
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Explicit rather than inferred from the git remote: this step must
          # survive a failure in Checkout, when there is no local repo.
          GH_REPO: ${{ github.repository }}
          MISSING: ${{ steps.gate.outputs.missing }}
          ISSUE_LABEL: newsletter-alarm
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # `gh issue create --label X` hard-fails on a label that does not
          # exist, which would make this step swallow the alert it exists to
          # raise. Create on demand; ignore "already exists".
          gh label create "$ISSUE_LABEL" \
            --color B60205 \
            --description "Automated newsletter monitoring" \
            >/dev/null 2>&1 || true

          if [ -n "$MISSING" ]; then
            ISSUE_TITLE='🚨 [Newsletter] Weekly broadcast cannot run: Resend secrets are missing'
          else
            ISSUE_TITLE='🚨 [Newsletter] Weekly broadcast job failed'
          fi
          export ISSUE_TITLE

          # Built with printf and quoted heredocs, never an unquoted heredoc:
          # the log tail is text from the run, and must not be expanded.
          BODY_FILE="$RUNNER_TEMP/weekly-broadcast-issue.md"
          LOG_FILE="$RUNNER_TEMP/weekly-broadcast.log"
          {
            if [ -n "$MISSING" ]; then
              printf '%s\n' "The weekly broadcast job could not run. Missing repository secret(s): **${MISSING}**. **No episode will be scheduled for Saturday until they are set.**"
              cat <<'EOF'

          Add both under Settings → Secrets and variables → Actions, if either is missing:

          - `RESEND_API_KEY`: a **Full access** Resend key. A Sending-access key cannot list or schedule broadcasts.
          - `RESEND_WEEKLY_STORIES_SEGMENT_ID`: the id of the weekly-stories segment, the same value Vercel Production has.

          Then run it (Actions → Weekly Broadcast → Run workflow) and close this issue. It fails rather than skipping
          on purpose: a silently skipped send is the failure this job exists to end.
          EOF
            else
              cat <<'EOF'
          The weekly broadcast job failed. **Check whether Saturday's episode is scheduled** (Resend → Broadcasts):
          if it is not, nothing goes out on Saturday unless a later run succeeds.
          EOF
            fi
            printf '\n**Failed run:** %s\n' "$RUN_URL"
            if [ -n "$MISSING" ]; then
              :
            elif [ -s "$LOG_FILE" ]; then
              printf '\nThe end of its output:\n\n```\n'
              tail -n 40 "$LOG_FILE"
              printf '```\n'
            else
              printf '\nIt failed before the validator or the script printed anything: checkout, dependency install, or runner setup. The run log says which step.\n'
            fi
            cat <<'EOF'

          ### Likely causes, cheapest first

          1. A Resend secret is missing, rotated or revoked, or `RESEND_API_KEY` is a Sending-access key
             (`restricted_api_key`). It must be **Full access**.
          2. A guard refused: the episode page did not answer 200 in production, or
             `config.business.postalAddress` is not publishable. Fix it, deploy, and run the workflow again.
          3. Resend is in a state the job will not guess about: two drafts for one episode, a near-miss name
             (`Episode 6 - …`) that has gone out, a status it does not know, or a draft that is no longer what the
             builder makes. The output says what to change in Resend.
          4. A call to Resend got no answer, so it may or may not have happened. Look in Resend before running
             anything by hand; the next scheduled run reconciles on its own.
          5. `pnpm validate:broadcast` failed: the code on main would decide wrongly, so nothing was scheduled.

          Once it is fixed: Actions → Weekly Broadcast → Run workflow, then close this issue.

          Runbook: `docs/runbooks/newsletter.md`.

          _Opened automatically by `.github/workflows/weekly-broadcast.yml`._
          EOF
          } > "$BODY_FILE"

          # Comment on the open issue rather than stacking a new one every run.
          # A duplicate pile is the fastest way to get an alarm muted.
          EXISTING=$(gh issue list \
            --state open \
            --label "$ISSUE_LABEL" \
            --limit 100 \
            --json number,title \
            --jq 'map(select(.title == $ENV.ISSUE_TITLE)) | .[0].number // empty') || EXISTING=

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY_FILE"
            echo "Commented on existing issue #${EXISTING}."
          else
            gh issue create \
              --title "$ISSUE_TITLE" \
              --label "$ISSUE_LABEL" \
              --body-file "$BODY_FILE"
          fi
