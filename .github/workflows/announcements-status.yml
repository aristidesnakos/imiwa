name: Announcement Queue Status

# Turns the announcement queue from a config file into something that is
# actually managed.
#
# Every entry in lib/announcements/config.ts carries an `expiresAt`, so a run
# always *ends* on time without anyone remembering. What the app cannot tell
# anyone is that a run is about to *start* and its pre-flight gate has not been
# checked, that finished entries are piling up in the config, or that the queue
# has run dry. Those are calendar facts, so a calendar job notices them.
#
# The report becomes a single tracking issue that this workflow keeps up to
# date in place and closes on its own once there is nothing left to do — not a
# new issue every morning, and never a failing check. A red X for "an
# announcement starts on Tuesday" is how you train people to ignore a signal.

on:
  schedule:
    # 07:00 UTC daily — before the working day, after any overnight deploy.
    # NOTE: GitHub disables scheduled workflows on repositories with no commit
    # activity for 60 days. If this stops firing, that is why; a push re-enables
    # it. Nothing about the banner breaks in the meantime — expiry is enforced
    # in the app, not here.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Pretend today is this YYYY-MM-DD (for testing the report)'
        required: false
        type: string

concurrency:
  group: announcements-status
  cancel-in-progress: false

jobs:
  report:
    name: Report on the announcement queue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    env:
      ISSUE_TITLE: 'Announcement queue — needs a look'
      ISSUE_LABEL: announcements

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A config that fails validation must never drive an issue telling
      # someone the queue is fine.
      - name: Validate the queue before reporting on it
        run: pnpm validate:announcements

      - name: Build the report
        id: status
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            pnpm -s announcements:status -- --date "${{ inputs.date }}" | tee report.md
          else
            pnpm -s announcements:status | tee report.md
          fi

      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Idempotent: creates the label on first run, no-ops afterwards.
          gh label create "$ISSUE_LABEL" \
            --color BFD4F2 \
            --description "Scheduled status of the returning-user announcement bar" \
            --force

          EXISTING=$(gh issue list \
            --state open \
            --label "$ISSUE_LABEL" \
            --search "$ISSUE_TITLE in:title" \
            --json number \
            --jq '.[0].number // empty')

          {
            echo "<!-- managed by .github/workflows/announcements-status.yml — edits will be overwritten -->"
            echo
            cat report.md
            echo
            echo "---"
            echo "_Regenerated by [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Closes itself when there is nothing left to do._"
          } > issue-body.md

          if [ "${{ steps.status.outputs.actionable }}" != "true" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" \
                --comment "Nothing in the queue needs a person any more. Closing; a new issue opens if that changes."
              echo "Closed #$EXISTING — queue is quiet."
            else
              echo "Queue is quiet and no issue is open. Nothing to do."
            fi
            exit 0
          fi

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file issue-body.md
            echo "Updated #$EXISTING in place."
          else
            gh issue create \
              --title "$ISSUE_TITLE" \
              --label "$ISSUE_LABEL" \
              --body-file issue-body.md
            echo "Opened a new tracking issue."
          fi
