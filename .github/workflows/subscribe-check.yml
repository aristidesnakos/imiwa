name: Subscribe Consent Check

# Guards the double-opt-in email consent model (lib/email/subscribe-token.ts,
# lib/analytics/email-signup-sources.ts, app/api/subscribe/**).
#
# The contact record created here is our only consent record, and the
# promises `pnpm validate:subscribe` asserts are the ones that matter
# legally, not just functionally:
#
#   - a contact is NEVER created without a valid, unexpired, correctly-signed
#     token;
#   - a forged token cannot subscribe anyone, including via the `alg: none`
#     algorithm-confusion hole `jsonwebtoken` opens if `algorithms` is not
#     pinned on verify;
#   - an expired token still verifies its signature (so the re-subscribe form
#     stays attributed) but is refused as consent;
#   - a `source` outside EMAIL_SIGNUP_SOURCES never reaches an email we send;
#   - the episode email's campaign tags are identical for every recipient and
#     never reach the unsubscribe link or the pre-consent confirmation email.
#
# It also runs `pnpm validate:broadcast`, the weekly broadcast job's decisions
# (.github/workflows/weekly-broadcast.yml): which Saturday and which episode,
# what counts as already sent, that a cancelled Saturday stays cancelled, and
# that the email it builds is the weekly one, tagged `utm_content=weekly` with
# Resend's unsubscribe placeholder left bare. That job books a real send to
# every subscriber unattended, so its rules are asserted against fake Resend
# state here, before they reach main.
#
# This migration replaced a Kit proxy that had a fallback minting
# `state: active` subscribers with no confirmation step at all — exactly the
# kind of bug that survives a migration silently, hence the gate.
#
# It reads TypeScript directly and needs no build, so it runs in seconds.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'lib/email/subscribe-token.ts'
      - 'lib/analytics/email-signup-sources.ts'
      - 'app/api/subscribe/**'
      - 'app/subscribed/**'
      - 'app/confirm/**'
      - 'lib/email/unsubscribe-token.ts'
      # The commercial-email footer: CAN-SPAM's postal address and the
      # unsubscribe link, rendered for both the welcome card and the broadcast.
      - 'lib/email/quiz-email.ts'
      # Campaign tags on its links, and the pre-consent confirmation email that
      # must never carry one.
      - 'lib/email/utm.ts'
      - 'lib/email/confirmation-email.ts'
      - 'lib/business/**'
      - 'config.ts'
      - 'types/config.ts'
      - 'scripts/validate-subscribe.ts'
      # The weekly broadcast: its builder, its queue, its slot, the two
      # scripts that use them, its validator and the job that runs it.
      - 'lib/email/broadcast.ts'
      - 'lib/email/broadcast-queue.ts'
      - 'lib/email/welcome-episode.ts'
      - 'lib/email/send-schedule.ts'
      - 'scripts/stories/schedule-weekly-broadcast.ts'
      - 'scripts/stories/create-broadcast.ts'
      - 'scripts/validate-broadcast-schedule.ts'
      - '.github/workflows/weekly-broadcast.yml'
      - '.github/workflows/subscribe-check.yml'
  push:
    branches:
      - main
    paths:
      - 'lib/email/subscribe-token.ts'
      - 'lib/analytics/email-signup-sources.ts'
      - 'app/api/subscribe/**'
      - 'app/subscribed/**'
      - 'app/confirm/**'
      - 'lib/email/unsubscribe-token.ts'
      # The commercial-email footer: CAN-SPAM's postal address and the
      # unsubscribe link, rendered for both the welcome card and the broadcast.
      - 'lib/email/quiz-email.ts'
      # Campaign tags on its links, and the pre-consent confirmation email that
      # must never carry one.
      - 'lib/email/utm.ts'
      - 'lib/email/confirmation-email.ts'
      - 'lib/business/**'
      - 'config.ts'
      - 'types/config.ts'
      - 'scripts/validate-subscribe.ts'
      # The weekly broadcast: its builder, its queue, its slot, the two
      # scripts that use them, its validator and the job that runs it.
      - 'lib/email/broadcast.ts'
      - 'lib/email/broadcast-queue.ts'
      - 'lib/email/welcome-episode.ts'
      - 'lib/email/send-schedule.ts'
      - 'scripts/stories/schedule-weekly-broadcast.ts'
      - 'scripts/stories/create-broadcast.ts'
      - 'scripts/validate-broadcast-schedule.ts'
      - '.github/workflows/weekly-broadcast.yml'
      - '.github/workflows/subscribe-check.yml'
  workflow_dispatch:

concurrency:
  group: subscribe-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-subscribe:
    name: Validate the double opt-in consent model
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Must run before setup-node so that `cache: pnpm` can find pnpm.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate consent token model
        run: pnpm validate:subscribe

      # Pure, credential-free, and seconds long: fake broadcast lists and a
      # synthetic clock, never Resend.
      - name: Validate the weekly broadcast schedule
        run: pnpm validate:broadcast
