name: IndexNow Submit

# Daily push of new/changed sitemap URLs to IndexNow (Bing, Yandex, Naver,
# Seznam all subscribe to the same protocol) so they crawl changes within
# minutes instead of waiting on their own schedule. Google is deliberately
# NOT part of this — Google's Indexing API is restricted to JobPosting /
# Livestream schema by their own terms, so there is no legitimate equivalent
# push for a page like this. See scripts/check-index-status.ts for the
# Google-side tool (monitoring, not pushing) and the header of
# scripts/submit-indexnow.ts for the full rationale.
#
# Unlike indexation-alarm.yml, this workflow needs NO secret: the IndexNow key
# is a committed, non-sensitive verification token (lib/seo/indexnow.ts +
# public/<key>.txt), not a credential.

on:
  # Daily at 06:00 UTC — an hour before indexation-alarm.yml's Monday 07:00 UTC
  # run, so the two never contend for runner minutes. Daily (vs. weekly) is
  # cheap here because the script is idempotent: it diffs against
  # data/indexnow-state.json and only calls the API when something actually
  # changed, so most days this is a fast no-op.
  schedule:
    - cron: '0 6 * * *'
  # Manual trigger for testing and for pushing immediately after a content update.
  workflow_dispatch:

# Serialise runs so two overlapping jobs can never race on the state file.
concurrency:
  group: indexnow-submit
  cancel-in-progress: false

jobs:
  submit-indexnow:
    name: Submit changed URLs to IndexNow
    runs-on: ubuntu-latest
    permissions:
      # Commit the updated data/indexnow-state.json back to the repo.
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run IndexNow submission
        run: pnpm exec tsx --tsconfig tsconfig.json scripts/submit-indexnow.ts

      - name: Commit updated IndexNow state
        if: always()
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain data/indexnow-state.json)" ]; then
            echo "No change to data/indexnow-state.json — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/indexnow-state.json
          # [skip ci] so this bot commit does not trigger other workflows or a
          # redundant Vercel production deploy — the file ships no runtime code.
          git commit -m "chore(seo): record IndexNow submission state [skip ci]"
          # Rebase before pushing in case a human pushed while the job ran.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
